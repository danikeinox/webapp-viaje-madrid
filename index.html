<!DOCTYPE html>
<html lang="es" data-text="m">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12263F" />
    <meta name="description" content="Guía de viaje a Madrid — del 13 al 15 de octubre de 2026" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Madrid" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Viaje a Madrid</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- Iconos (sprite). Se usan con <svg class="i"><use href="#i-nombre"/></svg> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
        <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5z"/></symbol>
        <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 14a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 5.5a4.25 4.25 0 0 1-.5 8.5z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></symbol>
        <symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l2-4M15 21l-2-4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></symbol>
        <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M7 21v-3M17 21v-3"/><circle cx="8" cy="14.5" r=".6"/><circle cx="16" cy="14.5" r=".6"/></symbol>
        <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="2"/></symbol>
        <symbol id="i-fork" viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M7 3v0M17 21V3c-2.5 1.5-3 4-3 7 0 2 1 3 3 3"/></symbol>
        <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></symbol>
        <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
        <symbol id="i-taxi" viewBox="0 0 24 24"><path d="M5 16l1.500-5.500A2 2 0 0 1 8.400 9h7.200a2 2 0 0 1 1.900 1.500L19 16M3 16h18v3H3zM9 9V7h6v2"/><circle cx="7.500" cy="16" r=".7"/><circle cx="16.500" cy="16" r=".7"/></symbol>
        <symbol id="i-sos" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.1"/></symbol>
        <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 1 1 3.500 2.300c-.7.400-1 .9-1 1.700M12 17v.1"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol>
        <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.500 10.900c.6.500 1 1.200 1 2.100h5c0-.9.400-1.600 1-2.100A6 6 0 0 0 12 3z"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.500v.1"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
        <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16.500 4.500a2.100 2.100 0 0 1 3 3L8 19z"/></symbol>
        <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 0 4v0a2 2 0 0 1 0 4v1a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-1a2 2 0 0 1 0-4v0a2 2 0 0 0 0-4V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M14 6v12" stroke-dasharray="2 2"/></symbol>
      </defs>
    </svg>

    <a class="skip" href="#main-content">Saltar al contenido</a>

    <div id="app">
      <header class="app-header">
        <div class="app-heading">
          <h1 class="app-title">Viaje a Madrid</h1>
          <p class="app-subtitle">Martes 13 – jueves 15 de octubre</p>
        </div>
        <button class="text-size-btn" id="text-size-btn" type="button" aria-label="Cambiar tamaño de la letra">
          <span aria-hidden="true">A<small>A</small></span>
          <span class="text-size-label" id="text-size-label">Letra normal</span>
        </button>
      </header>

      <main class="main-content" id="main-content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Menú principal">
        <button class="nav-btn active" data-section="hoy" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-sun" /></svg>
          <span class="nav-label">Hoy</span>
        </button>
        <button class="nav-btn" data-section="trayecto" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-train" /></svg>
          <span class="nav-label">Trayecto</span>
        </button>
        <button class="nav-btn" data-section="hostal" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-bed" /></svg>
          <span class="nav-label">Hostal</span>
        </button>
        <button class="nav-btn" data-section="comer" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-fork" /></svg>
          <span class="nav-label">Comer</span>
        </button>
        <button class="nav-btn" data-section="ver" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-compass" /></svg>
          <span class="nav-label">Ver</span>
        </button>
      </nav>

      <div class="sr-only" id="announcer" aria-live="polite"></div>

      <!-- Confirmación antes de llamar o abrir un enlace -->
      <div class="modal-overlay" id="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
          <h2 class="modal-title" id="modal-title">¿Seguro?</h2>
          <p class="modal-message" id="modal-message"></p>
          <div class="modal-actions">
            <button class="btn btn-primary" id="modal-confirm" type="button">Sí, continuar</button>
            <button class="btn btn-outline" id="modal-cancel" type="button">No, volver</button>
          </div>
        </div>
      </div>

      <!-- Ayuda -->
      <div class="modal-overlay" id="help-overlay" hidden>
        <div class="modal-box modal-box-wide" role="dialog" aria-modal="true" aria-labelledby="help-title">
          <h2 class="modal-title" id="help-title">Ayuda</h2>
          <div id="help-content"></div>
          <div class="modal-actions">
            <button class="btn btn-primary" id="help-close" type="button">Entendido</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
