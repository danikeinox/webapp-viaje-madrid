<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8B1A1A" />
    <meta name="description" content="Guía de viaje a Madrid — 13 al 16 de octubre de 2026" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Madrid Papás" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Viaje Madrid — Guía</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title">Viaje a Madrid</h1>
      <p class="app-subtitle">13 — 16 octubre 2026</p>
    </header>

    <main class="main-content" id="main-content" role="main"></main>

    <nav class="bottom-nav" aria-label="Menú principal">
      <button class="nav-btn active" data-section="ida" aria-label="Ida">
        <span class="nav-icon" aria-hidden="true">🚌</span>
        <span class="nav-label">Ida</span>
      </button>
      <button class="nav-btn" data-section="hotel" aria-label="Hotel">
        <span class="nav-icon" aria-hidden="true">🏨</span>
        <span class="nav-label">Hotel</span>
      </button>
      <button class="nav-btn" data-section="restaurantes" aria-label="Restaurantes">
        <span class="nav-icon" aria-hidden="true">🍽️</span>
        <span class="nav-label">Comer</span>
      </button>
      <button class="nav-btn" data-section="ocio" aria-label="Ocio">
        <span class="nav-icon" aria-hidden="true">🎭</span>
        <span class="nav-label">Ocio</span>
      </button>
      <button class="nav-btn" data-section="vuelta" aria-label="Vuelta">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label">Vuelta</span>
      </button>
    </nav>

    <!-- Modal de confirmación -->
    <div class="modal-overlay" id="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box">
        <h2 class="modal-title" id="modal-title">¿Está seguro?</h2>
        <p class="modal-message" id="modal-message"></p>
        <div class="modal-actions">
          <button class="btn btn-secondary btn-large" id="modal-cancel">No, volver</button>
          <button class="btn btn-primary btn-large" id="modal-confirm">Sí, continuar</button>
        </div>
      </div>
    </div>

    <!-- Modal de ayuda / taxi -->
    <div class="modal-overlay" id="help-overlay" hidden role="dialog" aria-modal="true">
      <div class="modal-box modal-box-wide">
        <h2 class="modal-title" id="help-title">Ayuda</h2>
        <div class="modal-message" id="help-content"></div>
        <div class="modal-actions">
          <button class="btn btn-primary btn-large" id="help-close">Entendido</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
  </body>
</html>
